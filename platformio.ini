[platformio]
default_envs = m5stick-c-plus

[env:m5stick-c-plus]
platform = espressif32@6.4.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps = m5stack/M5Unified@0.2.25
build_flags = -DCORE_DEBUG_LEVEL=0

; 2-minute session for testing the FINISHED path: pio run -e test -t upload
[env:test]
extends = env:m5stick-c-plus
build_flags = ${env:m5stick-c-plus.build_flags} -DSESSION_MIN=2

; M5StickS3 (ESP32-S3-PICO-1-N8R8): the same code, its own build. UNTESTED on a real device.
[env:m5stick-s3]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_deps = m5stack/M5Unified@0.2.25
build_flags = -DCORE_DEBUG_LEVEL=0 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; Test of the refusal screen: behaves like a board without an IMU (an M5StickC Plus SE).
[env:test-unsupported]
extends = env:m5stick-c-plus
build_flags = ${env:m5stick-c-plus.build_flags} -DFAKE_NO_IMU
