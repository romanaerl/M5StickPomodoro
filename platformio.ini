[platformio]
default_envs = m5stick-c-plus

[env:m5stick-c-plus]
platform = espressif32@6.4.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps = m5stack/M5Unified@0.2.25
build_flags = -DCORE_DEBUG_LEVEL=0

; 2-minute session for testing the FINISHED path: pio run -e test -t upload
[env:test]
extends = env:m5stick-c-plus
build_flags = ${env:m5stick-c-plus.build_flags} -DSESSION_MIN=2
