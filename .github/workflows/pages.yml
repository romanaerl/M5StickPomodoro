# Publishes the web installer (GitHub Pages) from the `production` branch: every push to it builds the
# firmware, assembles the installer page with its ESP Web Tools manifest, and deploys it.
# A pushed version tag (v*) rebuilds it too, so the version in the page header follows the newest tag
# even when the tag comes after the last push to production. The site is always built from production.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [production]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0  # tags, for the version shown on the page

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and the Markdown renderer
        run: pip install platformio markdown-it-py==4.2.0 mdit-py-plugins==0.6.1

      - name: Build the installer site
        run: scripts/build_web.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
