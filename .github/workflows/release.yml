# Builds the firmware on every push and pull request. On a version tag (v1.2.3) it also publishes a
# GitHub release with the single-file images M5StickPomodoro-v1.2.3.bin (ESP32: StickC, StickC Plus,
# StickC Plus2) and M5StickPomodoro-v1.2.3-S3.bin (ESP32-S3: StickS3); flash either at offset 0x0.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the version in the file name

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build the single-file image
        run: scripts/build_release.sh "${GITHUB_REF_NAME//\//-}"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.bin

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/M5StickPomodoro-"$GITHUB_REF_NAME".bin \
            dist/M5StickPomodoro-"$GITHUB_REF_NAME"-S3.bin \
            --title "M5StickPomodoro $GITHUB_REF_NAME" \
            --notes "Single-file firmware. M5StickPomodoro-$GITHUB_REF_NAME.bin: M5StickC Plus and M5StickC (tested), M5StickC Plus2 (untested); the board is detected at boot. M5StickPomodoro-$GITHUB_REF_NAME-S3.bin: M5StickS3 (untested). Flash at offset 0x0 — see the README: Flashing without building."
